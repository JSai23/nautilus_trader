mode: "backtest"

strategy:
  path: "experiments.strategies.momentum_drift:MomentumDrift"
  params:
    trade_size: 5.0         # minimum real CLOB size — fills against thin books
    check_interval_minutes: 1
    lookback: 2
    min_drift: 0.01
    max_spread: 0.06
    entry_mid_low: 0.51
    entry_mid_high: 0.80
    min_hold: 1
    take_profit_delta: 0.05   # exit earlier while book is liquid
    stop_loss_delta: 0.04
    reversal_threshold: 0.06
    convergence_threshold: 0.85

# btc-updown-15m: 4 markets in 2026-03-13 T20 hour (in-sample)
