# Bug bash: tick_stress strategy via slug discovery
# Trades on every book update — should produce fills with any data

mode: "backtest"

strategy:
  path: "experiments.strategies.tick_stress:TickStressStrategy"
  params:
    instrument_ids: []
    trade_size: 5.0
    buy_after_ticks: 3
    sell_after_ticks: 10
    sweep_ticks: 20
    max_entry_price: 0.95
    min_entry_price: 0.05
    tick_size: 0.001
    convergence_threshold: 0.99
    take_profit: null
    stop_loss: null

universe:
  slug_contains: "btc-updown-4h"
  active: true
  max_markets: 5

data:
  hours:
    - "2026-03-13T10"
    - "2026-03-13T11"
    - "2026-03-13T12"

fees: "zero"

starting_balance: 10000.0

mlflow:
  experiment: "bug-bash"
  parent_run: "tick-stress-slug"
  tags:
    purpose: "bug-bash-tick"
