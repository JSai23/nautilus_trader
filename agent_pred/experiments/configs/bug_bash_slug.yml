# Bug bash: slug-based discovery → Gamma API → instruments → backtest
# Tests the full pipeline WITHOUT hardcoded condition_ids

mode: "backtest"

strategy:
  path: "experiments.strategies.timer_momentum:TimerMomentumStrategy"
  params:
    instrument_ids: []
    trade_size: 5.0
    check_interval_minutes: 1
    hold_periods: 8
    max_spread: 0.20
    max_entry_price: 0.92
    min_entry_price: 0.08
    convergence_threshold: 0.99
    take_profit: null
    stop_loss: null

universe:
  slug_contains: "btc-updown-15m"
  active: true
  max_markets: 10

data:
  hours:
    - "2026-03-13T12"

fees: "zero"

starting_balance: 10000.0

mlflow:
  experiment: "bug-bash"
  parent_run: "slug-discovery-test"
  tags:
    purpose: "bug-bash-v1"
