# Spread scalper strategy — enter on tight spreads, exit on widening
#
# Monitors rolling spread average, enters when current spread tightens
# below threshold, exits when spread widens or after hold period.
#
# Run:
#   uv run python scripts/run_backtest.py experiments/configs/spread_scalper.yml

mode: "backtest"

strategy:
  path: "experiments.strategies.spread_scalper:SpreadScalperStrategy"
  params:
    instrument_ids: []
    trade_size: 5.0
    check_interval_minutes: 1
    spread_lookback: 10
    tight_spread_ratio: 0.6
    wide_spread_ratio: 1.4
    hold_periods: 5
    max_spread: 0.15
    max_entry_price: 0.92
    min_entry_price: 0.08
    convergence_threshold: 0.99
    take_profit: null
    stop_loss: null

# Volatile markets with significant intra-hour price movement (gap > 0.10)
