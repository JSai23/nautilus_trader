# Example backtest configuration
#
# With Gamma API discovery:
#   uv run python scripts/run_backtest.py configs/example_backtest.yml --discover
#
# With pre-cached metadata:
#   uv run python scripts/run_backtest.py configs/example_backtest.yml
#
# Refresh cached metadata:
#   uv run python scripts/run_backtest.py configs/example_backtest.yml --discover --refresh-metadata

mode: "backtest"

strategy:
  path: "strategy.imbalance:ImbalanceStrategy"
  params:
    instrument_ids: []  # Populated from universe resolution
    imbalance_threshold: 0.3
    convergence_threshold: 0.80  # Lower than default (0.95) for thin binary option books
    trade_size: 10.0
    take_profit: null
    stop_loss: null

# Leave condition_ids empty to use discovery or cached markets.
# Or specify specific markets:
# condition_ids:
#   - "0xabc123..."
condition_ids: []

max_markets: 20  # Cap discovery to keep backtest <5 min

# Gamma API discovery filters (used with --discover flag)
discovery:
  active: true
  closed: false
  min_volume: 1000
  max_markets: 20
  categories: []  # e.g. ["crypto", "politics"]

data:
  hours:
    - "2026-03-09T09"

fees: "zero"  # Use "polymarket" for realistic fees

starting_balance: 10000.0

mlflow:
  experiment: "imbalance-crypto-hourly"
  parent_run: "v1-simple-threshold"
  tags:
    iteration: "1"
    agent: "manual"
