# Example backtest configuration
#
# Run:
#   uv run python scripts/run_backtest.py configs/example_backtest.yml

mode: "backtest"

strategy:
  path: "strategy.imbalance:ImbalanceStrategy"
  params:
    instrument_ids: []  # Populated from universe resolution
    imbalance_threshold: 0.3
    convergence_threshold: 0.80  # Lower than default (0.95) for thin binary option books
    trade_size: 10.0
    take_profit: null
    stop_loss: null

# Discover markets from Gamma API using these filters.
# Or specify specific markets with condition_ids: ["0xabc..."]
universe:
  active: true
  closed: false
  volume_min: 1000
  max_markets: 20
  # slug_contains: "bitcoin"     # client-side substring match
  # end_date_min: "2026-04-01"   # server-side date filter
  # categories: ["crypto"]       # client-side category match

data:
  hours:
    - "2026-03-09T09"

fees: "zero"  # Use "polymarket" for realistic fees

starting_balance: 10000.0

mlflow:
  experiment: "imbalance-crypto-hourly"
  parent_run: "v1-simple-threshold"
  tags:
    iteration: "1"
    agent: "manual"
