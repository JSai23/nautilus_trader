# Active strategy — current default for agent orchestrator runs
#
# Points to TimerMomentum as the active strategy under development.
# The orchestrator reads this file to determine which strategy to run.
#
# Run:
#   uv run python scripts/run_backtest.py configs/active_strategy.yml --discover

mode: "backtest"

strategy:
  path: "strategy.timer_momentum:TimerMomentumStrategy"
  params:
    instrument_ids: []
    trade_size: 5.0
    check_interval_minutes: 1
    hold_periods: 8
    max_spread: 0.20
    max_entry_price: 0.92
    min_entry_price: 0.08
    convergence_threshold: 0.99
    take_profit: null
    stop_loss: null

# Volatile markets with significant intra-hour price movement
condition_ids:
  - "0x884c293e9eeeda6065f05e75fca16fd4d67b5fb911ee854b1bed58c785d3b33d"
  - "0x43e8c6312bc19e346a090e2c2364aa09f8a73a594230a2fb183ad42c02e5a094"
  - "0xbce2010b2d4d705aac9ff546bde7931833ad505e7d56479b5d1e472096f04619"

data:
  hours:
    - "2026-03-09T08"
    - "2026-03-09T09"
    - "2026-03-09T10"

fees: "zero"

starting_balance: 10000.0

mlflow:
  experiment: "timer-momentum"
  parent_run: "active"
  tags:
    agent: "orchestrator"
    purpose: "active-strategy"
