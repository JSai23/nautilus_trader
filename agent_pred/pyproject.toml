[project]
name = "agent-pred"
version = "0.1.0"
description = "Polymarket prediction market research playground using NautilusTrader"
requires-python = ">=3.12"
dependencies = [
    "pyarrow>=19.0",
    "fsspec>=2024.12",
    "aiohttp>=3.11",
    "pyyaml>=6.0",
    "mlflow>=2.21",
    "nautilus_trader>=1.210",
    "py-clob-client>=0.34.6",
]

[dependency-groups]
dev = [
    "pytest>=7.4.4",
    "pytest-timeout>=2.4.0",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["runner*", "strategy*", "pmxt*", "universe*", "discovery*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "network: requires network access (deselect with -m 'not network')",
]
